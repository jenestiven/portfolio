<svg width="100%" viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif" role="img">
<title>Flujo metodológico de gestión catastral en UAEGBS</title>
<desc>Diagrama genérico del proceso: solicitud, levantamiento topográfico, procesamiento de coordenadas MAGNA-SIRGAS, validación y actualización catastral, entrega de reporte.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="200" y="20" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="350" y="42" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Solicitud / requerimiento</text>
<line x1="350" y1="64" x2="350" y2="112" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="175" y="114" width="350" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="350" y="134" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Levantamiento topográfico en campo</text>
<text x="350" y="152" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Equipos GNSS / estación total</text>
<line x1="350" y1="170" x2="350" y2="218" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="150" y="220" width="400" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
<text x="350" y="240" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">Procesamiento de coordenadas</text>
<text x="350" y="258" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Sistema de referencia MAGNA-SIRGAS</text>
<line x1="350" y1="276" x2="350" y2="324" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="175" y="326" width="350" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
<text x="350" y="346" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Validación y actualización catastral</text>
<text x="350" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Contraste con base de datos predial</text>
<line x1="350" y1="382" x2="350" y2="416" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="200" y="418" width="300" height="44" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="350" y="440" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#2C2C2A">Reporte y entrega final</text>
</svg>
